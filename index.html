.tg{font:inherit;font-size:10px;color:var(--mute);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 9px}

#modes{display:flex;justify-content:center;gap:18px;padding-top:4px}
.md{font:inherit;font-size:10px;letter-spacing:.14em;color:var(--mute);background:none;border:0;padding:4px 6px}.md.on{color:var(--accent)}
body.video #shutter::after{background:#e5312b}body.rec #shutter::after{background:#e5312b;inset:20px;border-radius:6px}

#pend{position:absolute;inset:0;background:#000c;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5}
#pendBtn{font:inherit;font-size:14px;font-weight:700;color:#fff;background:var(--accent);border:0;border-radius:28px;padding:16px 26px}
#pendNo{font:inherit;font-size:11px;color:var(--mute);background:none;border:0;padding:8px}
.tg.on{color:var(--accent);border-color:var(--accent)}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}

#stamp{position:absolute;right:5%;bottom:4.5%;color:#ff9a3c;font-weight:700;font-size:15px;letter-spacing:.12em;text-shadow:0 0 6px #ff5a1099;display:none;line-height:1;pointer-events:none;white-space:pre}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#name{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-size:11px;background:#000a;padding:5px 12px;border-radius:14px;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;line-height:1.2}
#empty{color:var(--mute);font-size:12px;text-align:center;line-height:1.8;padding:30px 24px;display:none}
#busy{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#000b;font-size:10px;padding:5px 12px;border-radius:20px;display:none;line-height:1.2}
#cats{display:flex;gap:4px;overflow-x:auto;padding:6px 12px 0;scrollbar-width:none}
#cats::-webkit-scrollbar,#films::-webkit-scrollbar{display:none}
.cat{flex:none;font:inherit;font-size:10px;letter-spacing:.08em;color:var(--mute);background:none;border:0;padding:6px 9px;border-bottom:2px solid transparent}
.cat.on{color:var(--ink);border-color:var(--accent)}
#films{display:flex;gap:6px;overflow-x:auto;padding:6px 12px;scrollbar-width:none}
.film{flex:none;width:66px;border:0;background:none;color:var(--mute);font:inherit;font-size:8.5px;padding:0;text-align:center;line-height:1.25}
.film canvas{width:66px;height:88px;border-radius:5px;display:block;margin-bottom:4px;border:2px solid transparent;background:var(--panel)}
.film.on{color:var(--ink)}.film.on canvas{border-color:var(--accent)}
.opt{display:flex;gap:8px;align-items:center;justify-content:center;font-size:10px;color:var(--mute);padding:2px 16px 0}
.opt input[type=range]{flex:1;max-width:240px;accent-color:var(--accent)}
#bar{display:flex;align-items:center;justify-content:space-between;padding:6px 20px 10px;gap:12px}
.side{width:96px;font:inherit;font-size:11px;padding:12px 0;border-radius:24px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-align:center}
.side small{display:block;font-size:8px;color:var(--mute);margin-top:1px}
#save{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
#save:disabled{opacity:.35}
#shutter{width:70px;height:70px;border-radius:50%;border:4px solid var(--ink);background:transparent;position:relative;padding:0}
#shutter::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--ink)}

input[type=file]{display:none}
video{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none}
.review .lv{display:none!important}.live .rv{display:none!important}
#sheet{position:fixed;inset:0;background:var(--bg);z-index:9;display:none;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 16px 20px;gap:12px;overflow:auto}

#sheet button{font:inherit;font-size:12px;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:10px 18px;border-radius:20px}

let chunks=[];
function startRec(){if(!stream||rec||!window.MediaRecorder)return;const cs=view.captureStream(30),ms=new MediaStream([...cs.getVideoTracks(),...stream.getAudioTracks()]);
 const mt=["video/mp4;codecs=avc1,mp4a","video/mp4","video/webm;codecs=vp9,opus","video/webm"].find(m=>MediaRecorder.isTypeSupported(m))||"";
 try{rec=new MediaRecorder(ms,Object.assign({videoBitsPerSecond:14e6},mt?{mimeType:mt}:{}))}catch(e){rec=new MediaRecorder(ms)}
 chunks=[];const d0=new Date();rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
 rec.onstop=()=>{const type=(rec&&rec.mimeType||mt||"video/mp4").split(";")[0],ext=type.includes("webm")?"webm":"mp4";rec=null;document.body.classList.remove("rec");srcW=0;
  const bl=new Blob(chunks,{type});chunks=[];if(bl.size)deliver([new File([bl],`CAMZ_${d0.toISOString().slice(0,19).replace(/[-:T]/g,"")}_${film.id}.${ext}`,{type})])};
 rec.start(1000);recT0=performance.now();document.body.classList.add("rec")}
function stopRec(){if(rec&&rec.state!=="inactive")rec.stop()}
function enterReview(c){frozen=c;mode="review";document.body.className="review";srcW=c.width;srcH=c.height;seed=Math.random()*90;
 $("frame").style.display="block";$("empty").style.display="none";layout();main.upload(frozen,true);paint();setDate();thumbs(c,c.width,c.height);scheduleFull()}
function paint(){if(mode==="review"&&frozen&&main)main.draw(film,held?0:amt,seed)}
$("back").onclick=()=>{mode="live";document.body.className="live";frozen=null;outFiles=null;++job;busy.style.display="none";lastVT=-1;setDate();$("meta").textContent="";startCam()};

let outFiles=null;
function scheduleFull(){const my=++job;outFiles=null;$("save").disabled=true;busy.style.display="block";
 setTimeout(async()=>{if(my!==job||!frozen)return;const files=await develop(frozen,seed);if(my!==job)return;outFiles=files;busy.style.display="none";$("save").disabled=false},150)}
function drawStamp(x,W,H){const fs=Math.round(Math.min(W,H)*.042);x.font=`700 ${fs}px ui-monospace,Menlo,monospace`;x.textAlign="right";x.textBaseline="alphabetic";
 x.shadowColor="rgba(255,90,16,.7)";x.shadowBlur=fs*.45;x.fillStyle="#ff9a3c";x.fillText(stampTxt(shotDate),W*.95,H*.955);x.shadowBlur=0}

// ================= EXIF =================
function readExif(buf){const b=new Uint8Array(buf);if(b[0]!==0xFF||b[1]!==0xD8)return null;let p=2;
 while(p+4<b.length&&b[p]===0xFF){const m=b[p+1];if(m===0xDA)break;const len=(b[p+2]<<8)|b[p+3];
  if(m===0xE1&&b[p+4]===0x45&&b[p+5]===0x78&&b[p+6]===0x69&&b[p+7]===0x66)return b.slice(p,p+2+len);p+=2+len}
 return null}
function exifInfo(seg){const v=new DataView(seg.buffer,seg.byteOffset,seg.byteLength),T=10,le=v.getUint16(T)===0x4949;
 const info={gps:false,date:null};try{
 const rd=(ifd,cb)=>{const n=v.getUint16(T+ifd,le);for(let i=0;i<n;i++){const e=T+ifd+2+i*12;cb(v.getUint16(e,le),e)}};
 const str=e=>{const c=v.getUint32(e+4,le),o=T+v.getUint32(e+8,le);let s="";for(let i=0;i<c-1;i++)s+=String.fromCharCode(v.getUint8(o+i));return s};
 let sub=0;
 rd(v.getUint32(T+4,le),(tag,e)=>{if(tag===0x0112)v.setUint16(e+8,1,le); // orientation → 1 (déjà appliquée)
  if(tag===0x8825)info.gps=true;if(tag===0x8769)sub=v.getUint32(e+8,le);if(tag===0x0132&&!info.date)info.date=str(e)});
 if(sub)rd(sub,(tag,e)=>{if(tag===0x9003)info.date=str(e)});
 }catch(e){}return info}
async function injectExif(blob,seg){const j=new Uint8Array(await blob.arrayBuffer());let p=2;
 if(j[2]===0xFF&&j[3]===0xE0)p=4+((j[4]<<8)|j[5]);
 return new Blob([j.slice(0,2),seg,j.slice(p)],{type:"image/jpeg"})}
function replaceExif(buf,seg){const b=new Uint8Array(buf);if(b[0]!==0xFF||b[1]!==0xD8)return null;let p=2,cut=null,ins=2;
 while(p+4<b.length&&b[p]===0xFF){const m=b[p+1];if(m===0xDA)break;const len=(b[p+2]<<8)|b[p+3];
  if(m===0xE0&&p===2)ins=p+2+len;
  if(m===0xE1&&b[p+4]===0x45&&b[p+5]===0x78&&b[p+6]===0x69&&b[p+7]===0x66){cut=[p,p+2+len];break}p+=2+len}
 return cut?new Blob([b.slice(0,cut[0]),seg,b.slice(cut[1])],{type:"image/jpeg"}):new Blob([b.slice(0,ins),seg,b.slice(ins)],{type:"image/jpeg"})}
function wrapTiff(t){const seg=new Uint8Array(10+t.length);seg.set([0xFF,0xE1,((t.length+8)>>8)&255,(t.length+8)&255,0x45,0x78,0x69,0x66,0,0]);seg.set(t,10);return seg}
// EXIF pour une photo prise dans CAMZ : appareil, date d'origine, fuseau horaire, dimensions
function minimalExif(d,w=0,h=0){const p=n=>String(n).padStart(2,"0"),dt=`${d.getFullYear()}:${p(d.getMonth()+1)}:${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}\0`;
 const tz=-d.getTimezoneOffset(),off=`${tz<0?"-":"+"}${p(Math.floor(Math.abs(tz)/60))}:${p(Math.abs(tz)%60)}\0`;
 const i0=[[0x010F,2,"Apple\0"],[0x0110,2,"iPhone\0"],[0x0131,2,"CAMZ 2.0\0"],[0x0132,2,dt],[0x8769,4,0]];
 const ex=[[0x9003,2,dt],[0x9004,2,dt],[0x9010,2,off],[0x9011,2,off],[0x9012,2,off],[0xA002,4,w],[0xA003,4,h]];
 const s0=2+i0.length*12+4,s1=2+ex.length*12+4,exOff=8+s0;let dOff=exOff+s1;i0[4][2]=exOff;
 const lay=l=>l.map(e=>{if(e[1]===2&&e[2].length>4){const o=dOff;dOff+=e[2].length+(e[2].length&1);return o}return null}),o0=lay(i0),o1=lay(ex);
 const t=new Uint8Array(dOff),v=new DataView(t.buffer);t.set([0x49,0x49,0x2A,0]);v.setUint32(4,8,true);
 const wr=(at,l,offs)=>{v.setUint16(at,l.length,true);at+=2;l.forEach((e,i)=>{v.setUint16(at,e[0],true);v.setUint16(at+2,e[1],true);
  if(e[1]===2){v.setUint32(at+4,e[2].length,true);const o=offs[i]!==null?offs[i]:at+8;if(offs[i]!==null)v.setUint32(at+8,o,true);for(let k=0;k<e[2].length;k++)t[o+k]=e[2].charCodeAt(k)}
  else{v.setUint32(at+4,1,true);v.setUint32(at+8,e[2],true)}at+=12});v.setUint32(at,0,true)};
 wr(8,i0,o0);wr(exOff,ex,o1);return wrapTiff(t)}
function addGps(seg,pos){try{const c=pos.coords,old=seg.slice(10),ov=new DataView(old.buffer),le=ov.getUint16(0)===0x4949;
 const ifd0=ov.getUint32(4,le),n=ov.getUint16(ifd0,le);
 for(let i=0;i<n;i++)if(ov.getUint16(ifd0+2+i*12,le)===0x8825)return seg;
 const base=old.length+(old.length&1),ifdSize=2+(n+1)*12+4,gpsOff=base+ifdSize;
 const ents=[],data=[];let dataLen=0;
 const rat=arr=>{const o=dataLen;data.push({o,arr});dataLen+=arr.length*8;return o};
 const dms=x=>{x=Math.abs(x);const d=Math.floor(x),m=Math.floor((x-d)*60),s=Math.round(((x-d)*60-m)*60*10000);return[[d,1],[m,1],[s,10000]]};
 const dt=new Date(pos.timestamp||Date.now()),p2=n=>String(n).padStart(2,"0");
 ents.push({tag:0,type:1,count:4,inl:[2,3,0,0]});
 ents.push({tag:1,type:2,count:2,inl:[c.latitude<0?83:78,0,0,0]});ents.push({tag:2,type:5,count:3,off:rat(dms(c.latitude))});
 ents.push({tag:3,type:2,count:2,inl:[c.longitude<0?87:69,0,0,0]});ents.push({tag:4,type:5,count:3,off:rat(dms(c.longitude))});
 if(c.altitude!=null){ents.push({tag:5,type:1,count:1,inl:[c.altitude<0?1:0,0,0,0]});ents.push({tag:6,type:5,count:1,off:rat([[Math.round(Math.abs(c.altitude)*100),100]])})}
 ents.push({tag:7,type:5,count:3,off:rat([[dt.getUTCHours(),1],[dt.getUTCMinutes(),1],[dt.getUTCSeconds(),1]])});
 const ds=`${dt.getUTCFullYear()}:${p2(dt.getUTCMonth()+1)}:${p2(dt.getUTCDate())}\0`;const dsOff=dataLen;dataLen+=12;
 ents.push({tag:0x1D,type:2,count:11,off:dsOff,str:ds});
 if(c.accuracy!=null)ents.push({tag:0x1F,type:5,count:1,off:rat([[Math.round(c.accuracy*100),100]])});
 const gpsSize=2+ents.length*12+4,dataOff=gpsOff+gpsSize,total=dataOff+dataLen;
 if(total+8>65535)return seg;
 const t=new Uint8Array(total),v=new DataView(t.buffer);t.set(old);
 let w=base;v.setUint16(w,n+1,le);w+=2;let done=false;
 const putGps=()=>{v.setUint16(w,0x8825,le);v.setUint16(w+2,4,le);v.setUint32(w+4,1,le);v.setUint32(w+8,gpsOff,le);w+=12;done=true};
 for(let i=0;i<n;i++){const e=ifd0+2+i*12;if(!done&&ov.getUint16(e,le)>0x8825)putGps();t.set(old.subarray(e,e+12),w);w+=12}
 if(!done)putGps();v.setUint32(w,ov.getUint32(ifd0+2+n*12,le),le);
 v.setUint32(4,base,le);
 w=gpsOff;v.setUint16(w,ents.length,le);w+=2;
 for(const e of ents){v.setUint16(w,e.tag,le);v.setUint16(w+2,e.type,le);v.setUint32(w+4,e.count,le);
  if(e.inl)t.set(e.inl,w+8);else v.setUint32(w+8,dataOff+e.off,le);w+=12}
 v.setUint32(w,0,le);
 for(const d of data)d.arr.forEach((r,i)=>{v.setUint32(dataOff+d.o+i*8,r[0],le);v.setUint32(dataOff+d.o+i*8+4,r[1],le)});
 for(let i=0;i<ds.length;i++)t[dataOff+dsOff+i]=ds.charCodeAt(i);
 return wrapTiff(t)}catch(e){return seg}}

// ---------- GPS ----------
function getPos(timeout){return new Promise(r=>{if(!navigator.geolocation)return r(null);
 navigator.geolocation.getCurrentPosition(p=>{lastPos=p;r(p)},()=>r(null),{enableHighAccuracy:true,maximumAge:30000,timeout})})}
function locate(){getPos(20000)}
setInterval(()=>{if(mode==="live"&&!document.hidden)locate()},45000);
function metaLine(info,gpsAdded,own){$("meta").innerHTML=`<b>EXIF ✓</b> ${own?"date ✓":(info.date||"")} · ${info.gps?"<b>GPS ✓</b>":gpsAdded?"<b>GPS ✓ (téléphone)</b>":"GPS … autorise la localisation"}`}

// ---------- Import (photothèque / appareil photo natif 12 MP) ----------
async function load(file,fromCam){if(!file||!main)return;const buf=await file.arrayBuffer();origBlob=file;exifSeg=readExif(buf);
 const rawSeg=exifSeg?exifSeg.slice():null;let info=exifSeg?exifInfo(exifSeg):{gps:false,date:null},gpsAdded=false;
 srcName=(file.name||"photo").replace(/\.[^.]+$/,"")||"photo";shotDate=new Date(file.lastModified||Date.now());
 if(info.date){const m=info.date.match(/(\d+):(\d+):(\d+) (\d+):(\d+):(\d+)/);if(m)shotDate=new Date(m[1],m[2]-1,m[3],m[4],m[5],m[6])}
 if(fromCam&&!info.gps){if(!lastPos||Date.now()-lastPos.timestamp>120000)await getPos(6000);
  if(lastPos&&Date.now()-lastPos.timestamp<180000){if(!exifSeg)exifSeg=minimalExif(shotDate);
   const s2=addGps(exifSeg,lastPos);gpsAdded=s2!==exifSeg;exifSeg=s2;
   if(gpsAdded)origBlob=replaceExif(buf,addGps(rawSeg||minimalExif(shotDate),lastPos))||file}}
 if(exifSeg)metaLine(info,gpsAdded,false);else $("meta").textContent="⚠ pas d'EXIF dans ce fichier";
 const img=new Image();img.onload=()=>{const iw=img.naturalWidth,ih=img.naturalHeight,mt=main.gl.getParameter(main.gl.MAX_TEXTURE_SIZE),s=Math.min(1,Math.sqrt(16.5e6/(iw*ih)),mt/Math.max(iw,ih)),c=document.createElement("canvas");
  c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(img.src);stopCam();enterReview(c)};
 img.src=URL.createObjectURL(file)}
$("cam").onchange=e=>{load(e.target.files[0],true);e.target.value=""};
$("lib").onchange=e=>{load(e.target.files[0],false);e.target.value=""};

// ---------- Enregistrement ----------
$("save").onclick=async()=>{if(!outFiles)return;const files=origOn?outFiles:outFiles.slice(0,1);if(await deliver(files))$("back").click()};
$("bOrig").addEventListener("click",()=>{if(mode==="review")scheduleFull()});
$("close").onclick=()=>$("sheet").style.display="none";

buildStrip();setDate();layout();
if(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia)startCam();else $("empty").style.display="block";
if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
