<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CAMZ">
<title>CAMZ</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0e0d0b">
<style>
:root{--bg:#f3efe7;--panel:#e7e1d4;--ink:#1b1916;--mute:#6e675b;--accent:#d9541e;--line:#cfc7b6;--ok:#2f7d4a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0d0b;--panel:#1a1815;--ink:#f1ece0;--mute:#8f8777;--accent:#ff7a3c;--line:#2c2924;--ok:#6fcf8f}}
:root[data-theme="dark"]{--bg:#0e0d0b;--panel:#1a1815;--ink:#f1ece0;--mute:#8f8777;--accent:#ff7a3c;--line:#2c2924;--ok:#6fcf8f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:ui-monospace,"SF Mono",Menlo,monospace;overflow:hidden}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:baseline;padding:10px 16px 6px}
h1{font-size:15px;letter-spacing:.28em;margin:0;font-weight:700}
#meta{font-size:10px;color:var(--mute);text-align:right;line-height:1.4}
#meta b{color:var(--ok);font-weight:400}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:6px 16px;position:relative}
#view{max-width:100%;max-height:100%;border-radius:4px;display:none;box-shadow:0 6px 30px #0006}
#empty{color:var(--mute);font-size:12px;text-align:center;line-height:1.8;border:1px dashed var(--line);border-radius:8px;padding:40px 24px}
#busy{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);font-size:11px;padding:6px 12px;border-radius:20px;display:none}
#films{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;scrollbar-width:none}
#films::-webkit-scrollbar{display:none}
.film{flex:none;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:11px;padding:8px 11px 7px;border-radius:6px;text-align:left;line-height:1.3}
.film i{display:block;height:4px;border-radius:2px;margin-bottom:6px}
.film small{color:var(--mute);display:block;font-size:9px}
.film.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
#bar{display:flex;align-items:center;justify-content:space-between;padding:8px 22px 14px;gap:12px}
.side{width:92px;font:inherit;font-size:11px;padding:12px 0;border-radius:24px;border:1px solid var(--line);background:var(--panel);color:var(--ink);text-align:center}
#save{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
#save:disabled{opacity:.35}
#shutter{width:74px;height:74px;border-radius:50%;border:4px solid var(--ink);background:transparent;display:block;position:relative}
#shutter::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--ink)}
#shutter:active::after{inset:9px}
input[type=file]{display:none}
.opt{padding-left:16px;padding-right:16px;display:flex;gap:6px;align-items:center;justify-content:center;font-size:10px;color:var(--mute);padding-bottom:4px}
#sheet{position:fixed;inset:0;background:var(--bg);z-index:9;display:none;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 16px 20px;gap:12px;overflow:auto}
#sheet img{max-width:100%;max-height:70vh;border-radius:4px;-webkit-touch-callout:default;user-select:auto}
#sheet p{font-size:12px;text-align:center;line-height:1.6;margin:0}
#sheet a,#sheet button{font:inherit;font-size:12px;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:10px 18px;border-radius:20px;text-decoration:none}
</style>
</head>
<body>
<header><h1>CAMZ</h1><div id="meta">aucune photo</div></header>
<div id="stage">
  <div id="empty">Appuie sur le déclencheur<br>pour prendre une photo.<br><br>Choisis ta pellicule en bas.</div>
  <canvas id="view"></canvas>
  <div id="hint" style="position:absolute;top:12px;left:50%;transform:translateX(-50%);font-size:10px;color:#fff;background:#0008;padding:4px 10px;border-radius:12px;display:none">maintenir = voir l'original</div>
  <div id="busy">développement…</div>
</div>
<div id="films"></div>
<div class="opt"><span>intensité</span><input type="range" id="amt" min="0" max="100" value="100" style="display:inline;flex:1;max-width:220px;accent-color:var(--accent)"><span id="amtv">100%</span></div>
<label class="opt"><input type="checkbox" id="withOrig" style="display:inline" checked> enregistrer aussi l'original sans filtre</label>
<div id="bar">
  <label class="side" for="lib">Photothèque</label>
  <label id="shutter" for="cam" aria-label="Prendre une photo"></label>
  <button class="side" id="save" disabled>Enregistrer</button>
</div>
<input id="cam" type="file" accept="image/*" capture="environment">
<input id="lib" type="file" accept="image/*">
<div id="sheet">
  <p><b>Appui long sur l'image → « Enregistrer dans Photos »</b><br>(date, heure et GPS d'origine inclus)</p>
  <img id="out" alt="photo développée">
  <a id="dl" download>Télécharger le fichier</a>
  <button id="close">← Retour</button>
</div>
<script>
// ---------- Pellicules ----------
// g: gamma par canal (<1 éclaircit), gain par canal, c: contraste S, bl/wh: noir/blanc (fade),
// sat, sh/hi: teinte ombres/hautes lumières (RVB additif), grain, hal: halation, vig: vignette, bw
const FILMS=[
 {id:"portra400",n:"Portra 400",d:"Kodak · doux, peaux",col:"#e8b48a",g:[.92,.95,1.0],gain:[1.03,1.0,.95],c:.18,bl:.035,wh:.97,sat:.88,sh:[-2,4,6],hi:[10,5,-6],grain:.10,hal:.05,vig:.12},
 {id:"v500t",n:"Vision3 500T",d:"Kodak · ciné tungstène",col:"#3f8fa8",g:[1.04,.97,.90],gain:[.95,1.0,1.06],c:.30,bl:.03,wh:.96,sat:.92,sh:[-8,4,12],hi:[8,2,-6],grain:.16,hal:.30,vig:.20},
 {id:"cs800t",n:"CineStill 800T",d:"halo rouge, nuit",col:"#d8324a",g:[1.06,.98,.88],gain:[.96,1.0,1.08],c:.34,bl:.03,wh:.97,sat:1.0,sh:[-10,2,16],hi:[10,0,-4],grain:.20,hal:.65,vig:.22},
 {id:"v250d",n:"Vision3 250D",d:"Kodak · ciné jour",col:"#c9a45c",g:[.96,.97,1.0],gain:[1.02,1.0,.96],c:.26,bl:.03,wh:.96,sat:.94,sh:[-4,4,6],hi:[8,4,-8],grain:.10,hal:.15,vig:.15},
 {id:"gold200",n:"Gold 200",d:"Kodak · chaud, vacances",col:"#f0b429",g:[.90,.95,1.06],gain:[1.05,1.01,.90],c:.28,bl:.02,wh:.98,sat:1.12,sh:[4,2,-4],hi:[12,8,-10],grain:.13,hal:.06,vig:.16},
 {id:"ektar100",n:"Ektar 100",d:"Kodak · saturé, net",col:"#1f6fd1",g:[.98,.98,.98],gain:[1.02,1.0,1.02],c:.42,bl:.0,wh:1.0,sat:1.30,sh:[-2,0,6],hi:[4,2,0],grain:.05,hal:.0,vig:.10},
 {id:"pro400h",n:"Pro 400H",d:"Fuji · pastel, verts",col:"#7fc8a9",g:[.98,.92,.96],gain:[.98,1.02,1.0],c:.12,bl:.05,wh:.97,sat:.84,sh:[-6,8,6],hi:[2,6,2],grain:.10,hal:.03,vig:.08},
 {id:"superia",n:"Superia 400",d:"Fuji · vert/magenta",col:"#4aa05a",g:[1.0,.94,1.0],gain:[1.0,1.02,.98],c:.30,bl:.02,wh:.98,sat:1.08,sh:[-4,8,2],hi:[8,0,4],grain:.15,hal:.05,vig:.15},
 {id:"trix",n:"Tri-X 400",d:"Kodak · N&B contrasté",col:"#888",g:[1,1,1],gain:[1,1,1],c:.55,bl:.02,wh:.98,sat:0,sh:[0,0,0],hi:[0,0,0],grain:.26,hal:.08,vig:.22,bw:[.40,.45,.15]},
 {id:"hp5",n:"HP5 Plus",d:"Ilford · N&B doux",col:"#bbb",g:[.94,.94,.94],gain:[1,1,1],c:.25,bl:.05,wh:.96,sat:0,sh:[2,2,3],hi:[3,2,0],grain:.20,hal:.04,vig:.14,bw:[.30,.55,.15]},
];
let film=FILMS[0], srcImg=null, srcFile=null, exifSeg=null, fullBlob=null, job=0;
const $=id=>document.getElementById(id);
const view=$("view"), busy=$("busy");

const strip=$("films");
FILMS.forEach(f=>{const b=document.createElement("button");b.className="film"+(f===film?" on":"");
 b.innerHTML=`<i style="background:${f.col}"></i>${f.n}<small>${f.d}</small>`;
 b.onclick=()=>{film=f;[...strip.children].forEach(c=>c.classList.remove("on"));b.classList.add("on");
  try{localStorage.setItem("film",f.id)}catch(e){} render()};
 f.btn=b;strip.appendChild(b)});
try{const s=localStorage.getItem("film"),f=FILMS.find(x=>x.id===s);if(f)f.btn.click()}catch(e){}

// ---------- Moteur de rendu ----------
function luts(f){const L=[0,1,2].map(()=>new Uint8ClampedArray(256));
 for(let c=0;c<3;c++)for(let i=0;i<256;i++){let x=Math.pow(i/255,f.g[c])*f.gain[c];x=Math.min(1,x);
  const s=x*x*(3-2*x);x+= (s-x)*f.c; x=f.bl+x*(f.wh-f.bl); L[c][i]=x*255}
 return L}
let noiseTile=null;
function noise(){if(noiseTile)return noiseTile;const c=document.createElement("canvas");c.width=c.height=256;
 const x=c.getContext("2d"),d=x.createImageData(256,256);
 for(let i=0;i<d.data.length;i+=4){const v=128+(Math.random()+Math.random()+Math.random()-1.5)*110;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
 x.putImageData(d,0,0);return noiseTile=c}
function halation(ctx,W,H,f,k){if(!f.hal)return;
 const w=320,h=Math.max(1,Math.round(w*H/W)),a=document.createElement("canvas");a.width=w;a.height=h;
 const ax=a.getContext("2d");ax.drawImage(ctx.canvas,0,0,w,h);const d=ax.getImageData(0,0,w,h),p=d.data,thr=200;
 for(let i=0;i<p.length;i+=4){const l=.3*p[i]+.59*p[i+1]+.11*p[i+2];const v=l>thr?(l-thr)/(255-thr):0;p[i]=255*v;p[i+1]=70*v;p[i+2]=25*v}
 ax.putImageData(d,0,0);
 const b=document.createElement("canvas");b.width=Math.max(1,w>>3);b.height=Math.max(1,h>>3);const bx=b.getContext("2d");
 bx.imageSmoothingQuality="high";bx.drawImage(a,0,0,b.width,b.height);
 ax.globalAlpha=.75;ax.drawImage(b,0,0,w,h);ax.globalAlpha=1;
 ctx.save();ctx.globalCompositeOperation="screen";ctx.globalAlpha=Math.min(1,f.hal*k);ctx.imageSmoothingQuality="high";
 ctx.drawImage(a,0,0,W,H);ctx.drawImage(b,0,0,W,H);ctx.restore()}
function develop(canvas,img,W,H,f,k=1){
 canvas.width=W;canvas.height=H;const ctx=canvas.getContext("2d",{willReadFrequently:true});
 ctx.drawImage(img,0,0,W,H);if(k<=0)return;halation(ctx,W,H,f,k);
 const [LR,LG,LB]=luts(f),sat=1+(f.sat-1)*(f.bw?1:k),sh=f.sh,hi=f.hi,bw=f.bw,SH=512;
 for(let y=0;y<H;y+=SH){const hh=Math.min(SH,H-y),d=ctx.getImageData(0,y,W,hh),p=d.data;
  for(let i=0;i<p.length;i+=4){const o0=p[i],o1=p[i+1],o2=p[i+2];let r=LR[o0],g=LG[o1],b=LB[o2];
   let l=bw?bw[0]*r+bw[1]*g+bw[2]*b:.299*r+.587*g+.114*b;
   if(bw){r=g=b=l}else{r=l+(r-l)*sat;g=l+(g-l)*sat;b=l+(b-l)*sat}
   const t=l/255,ws=(1-t)*(1-t),wh=t*t;
   r+=sh[0]*ws+hi[0]*wh;g+=sh[1]*ws+hi[1]*wh;b+=sh[2]*ws+hi[2]*wh;
   p[i]=o0+(r-o0)*k;p[i+1]=o1+(g-o1)*k;p[i+2]=o2+(b-o2)*k}
  ctx.putImageData(d,0,y)}
 if(f.grain){const n=noise(),T=Math.max(128,Math.round(256*Math.max(W,H)/1600));ctx.save();ctx.globalCompositeOperation="overlay";ctx.globalAlpha=Math.min(1,f.grain*2.2*k);
  for(let y=0;y<H;y+=T)for(let x=0;x<W;x+=T)ctx.drawImage(n,x,y,T,T);ctx.restore()}
 if(f.vig){const R=Math.hypot(W,H)/2,gr=ctx.createRadialGradient(W/2,H/2,R*.45,W/2,H/2,R);
  gr.addColorStop(0,"rgba(0,0,0,0)");gr.addColorStop(1,`rgba(0,0,0,${f.vig*1.6*k})`);ctx.fillStyle=gr;ctx.fillRect(0,0,W,H)}
}
function fit(w,h,max){const s=Math.min(1,max/Math.max(w,h));return[Math.round(w*s),Math.round(h*s)]}

let amt=1;try{const a=localStorage.getItem("amt");if(a!==null){amt=+a;$("amt").value=amt*100;$("amtv").textContent=Math.round(amt*100)+"%"}}catch(e){}
function preview(k=amt){if(!srcImg)return;const [pw,ph]=fit(srcImg.naturalWidth,srcImg.naturalHeight,1100);develop(view,srcImg,pw,ph,film,k)}
function render(){if(!srcImg)return;const my=++job;fullBlob=null;$("save").disabled=true;preview();
 busy.style.display="block";
 setTimeout(()=>{if(my!==job)return;
  const [W,H]=fit(srcImg.naturalWidth,srcImg.naturalHeight,4096),c=document.createElement("canvas");
  develop(c,srcImg,W,H,film,amt);
  c.toBlob(async bl=>{c.width=c.height=0;if(my!==job)return;
   fullBlob=exifSeg?await injectExif(bl,exifSeg):bl;busy.style.display="none";$("save").disabled=false},"image/jpeg",.95)},120)}
$("amt").oninput=e=>{amt=e.target.value/100;$("amtv").textContent=e.target.value+"%";++job;$("save").disabled=true;preview()};
$("amt").onchange=()=>{try{localStorage.setItem("amt",amt)}catch(e){} render()};
let held=false;const hold=on=>{if(!srcImg||held===on)return;held=on;preview(on?0:amt)};
view.addEventListener("touchstart",e=>{e.preventDefault();hold(true)},{passive:false});
["touchend","touchcancel"].forEach(t=>view.addEventListener(t,()=>hold(false)));
view.addEventListener("mousedown",()=>hold(true));addEventListener("mouseup",()=>hold(false));

// ---------- EXIF : copie intégrale du bloc d'origine (date, heure, GPS, appareil) ----------
function readExif(buf){const b=new Uint8Array(buf);if(b[0]!==0xFF||b[1]!==0xD8)return null;let p=2;
 while(p+4<b.length&&b[p]===0xFF){const m=b[p+1];if(m===0xDA)break;const len=(b[p+2]<<8)|b[p+3];
  if(m===0xE1&&b[p+4]===0x45&&b[p+5]===0x78&&b[p+6]===0x69&&b[p+7]===0x66)return b.slice(p,p+2+len);p+=2+len}
 return null}
function exifInfo(seg){const v=new DataView(seg.buffer,seg.byteOffset,seg.byteLength),T=10,le=v.getUint16(T)===0x4949;
 const info={gps:false,date:null};try{
 const rd=(ifd,cb)=>{const n=v.getUint16(T+ifd,le);for(let i=0;i<n;i++){const e=T+ifd+2+i*12;cb(v.getUint16(e,le),e)}};
 const str=e=>{const c=v.getUint32(e+4,le),o=T+v.getUint32(e+8,le);let s="";for(let i=0;i<c-1;i++)s+=String.fromCharCode(v.getUint8(o+i));return s};
 let sub=0;
 rd(v.getUint32(T+4,le),(tag,e)=>{if(tag===0x0112)v.setUint16(e+8,1,le); // orientation → 1 (déjà appliquée au canvas)
  if(tag===0x8825)info.gps=true;if(tag===0x8769)sub=v.getUint32(e+8,le);if(tag===0x0132&&!info.date)info.date=str(e)});
 if(sub)rd(sub,(tag,e)=>{if(tag===0x9003)info.date=str(e)});
 }catch(e){}return info}
async function injectExif(blob,seg){const j=new Uint8Array(await blob.arrayBuffer());let p=2;
 if(j[2]===0xFF&&j[3]===0xE0)p=4+((j[4]<<8)|j[5]);
 return new Blob([j.slice(0,2),seg,j.slice(p)],{type:"image/jpeg"})}

// ---------- GPS de secours : si la photo arrive sans GPS, on écrit la position du téléphone ----------
let lastPos=null,origBlob=null;
function replaceExif(buf,seg){const b=new Uint8Array(buf);if(b[0]!==0xFF||b[1]!==0xD8)return null;let p=2,cut=null,ins=2;
 while(p+4<b.length&&b[p]===0xFF){const m=b[p+1];if(m===0xDA)break;const len=(b[p+2]<<8)|b[p+3];
  if(m===0xE0&&p===2)ins=p+2+len;
  if(m===0xE1&&b[p+4]===0x45&&b[p+5]===0x78&&b[p+6]===0x69&&b[p+7]===0x66){cut=[p,p+2+len];break}p+=2+len}
 return cut?new Blob([b.slice(0,cut[0]),seg,b.slice(cut[1])],{type:"image/jpeg"}):new Blob([b.slice(0,ins),seg,b.slice(ins)],{type:"image/jpeg"})}
function locate(){if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{lastPos=p},()=>{},{enableHighAccuracy:true,maximumAge:30000,timeout:20000})}
function minimalExif(d){const t=new Uint8Array(46),v=new DataView(t.buffer);t.set([0x49,0x49,0x2A,0]);v.setUint32(4,8,true);v.setUint16(8,1,true);
 v.setUint16(10,0x0132,true);v.setUint16(12,2,true);v.setUint32(14,20,true);v.setUint32(18,26,true);v.setUint32(22,0,true);
 const p=n=>String(n).padStart(2,"0"),s=`${d.getFullYear()}:${p(d.getMonth()+1)}:${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
 for(let i=0;i<19;i++)t[26+i]=s.charCodeAt(i);return wrapTiff(t)}
function wrapTiff(t){const seg=new Uint8Array(10+t.length);seg.set([0xFF,0xE1,((t.length+8)>>8)&255,(t.length+8)&255,0x45,0x78,0x69,0x66,0,0]);seg.set(t,10);return seg}
function addGps(seg,pos){try{const c=pos.coords,old=seg.slice(10),ov=new DataView(old.buffer),le=ov.getUint16(0)===0x4949;
 const ifd0=ov.getUint32(4,le),n=ov.getUint16(ifd0,le);
 for(let i=0;i<n;i++)if(ov.getUint16(ifd0+2+i*12,le)===0x8825)return seg;
 const base=old.length+(old.length&1),ifdSize=2+(n+1)*12+4,gpsOff=base+ifdSize;
 const ents=[],data=[];let dataLen=0;
 const rat=arr=>{const o=dataLen;data.push({o,arr});dataLen+=arr.length*8;return o};
 const dms=x=>{x=Math.abs(x);const d=Math.floor(x),m=Math.floor((x-d)*60),s=Math.round(((x-d)*60-m)*60*10000);return[[d,1],[m,1],[s,10000]]};
 const dt=new Date(pos.timestamp||Date.now()),p2=n=>String(n).padStart(2,"0");
 ents.push({tag:0,type:1,count:4,inl:[2,3,0,0]});
 ents.push({tag:1,type:2,count:2,inl:[c.latitude<0?83:78,0,0,0]});ents.push({tag:2,type:5,count:3,off:rat(dms(c.latitude))});
 ents.push({tag:3,type:2,count:2,inl:[c.longitude<0?87:69,0,0,0]});ents.push({tag:4,type:5,count:3,off:rat(dms(c.longitude))});
 if(c.altitude!=null){ents.push({tag:5,type:1,count:1,inl:[c.altitude<0?1:0,0,0,0]});ents.push({tag:6,type:5,count:1,off:rat([[Math.round(Math.abs(c.altitude)*100),100]])})}
 ents.push({tag:7,type:5,count:3,off:rat([[dt.getUTCHours(),1],[dt.getUTCMinutes(),1],[dt.getUTCSeconds(),1]])});
 const ds=`${dt.getUTCFullYear()}:${p2(dt.getUTCMonth()+1)}:${p2(dt.getUTCDate())}\0`;const dsOff=dataLen;dataLen+=12;
 ents.push({tag:0x1D,type:2,count:11,off:dsOff,str:ds});
 if(c.accuracy!=null)ents.push({tag:0x1F,type:5,count:1,off:rat([[Math.round(c.accuracy*100),100]])});
 const gpsSize=2+ents.length*12+4,dataOff=gpsOff+gpsSize,total=dataOff+dataLen;
 if(total+8>65535)return seg;
 const t=new Uint8Array(total),v=new DataView(t.buffer);t.set(old);
 // nouvel IFD0 = copie + entrée GPS, trié par tag
 let w=base;v.setUint16(w,n+1,le);w+=2;let done=false;
 const putGps=()=>{v.setUint16(w,0x8825,le);v.setUint16(w+2,4,le);v.setUint32(w+4,1,le);v.setUint32(w+8,gpsOff,le);w+=12;done=true};
 for(let i=0;i<n;i++){const e=ifd0+2+i*12;if(!done&&ov.getUint16(e,le)>0x8825)putGps();t.set(old.subarray(e,e+12),w);w+=12}
 if(!done)putGps();v.setUint32(w,ov.getUint32(ifd0+2+n*12,le),le);
 v.setUint32(4,base,le);
 w=gpsOff;v.setUint16(w,ents.length,le);w+=2;
 for(const e of ents){v.setUint16(w,e.tag,le);v.setUint16(w+2,e.type,le);v.setUint32(w+4,e.count,le);
  if(e.inl)t.set(e.inl,w+8);else v.setUint32(w+8,dataOff+e.off,le);w+=12}
 v.setUint32(w,0,le);
 for(const d of data)d.arr.forEach((r,i)=>{v.setUint32(dataOff+d.o+i*8,r[0],le);v.setUint32(dataOff+d.o+i*8+4,r[1],le)});
 for(let i=0;i<ds.length;i++)t[dataOff+dsOff+i]=ds.charCodeAt(i);
 return wrapTiff(t)}catch(e){return seg}}

// ---------- Chargement ----------
async function load(file,fromCam){if(!file)return;srcFile=file;origBlob=null;const buf=await file.arrayBuffer();exifSeg=readExif(buf);
 let rawSeg=exifSeg?exifSeg.slice():null; // orientation intacte, pour l'original
 let info=exifSeg?exifInfo(exifSeg):{gps:false,date:null},gpsAdded=false;
 if(fromCam&&!info.gps){ // photo prise à l'instant sans GPS → position du téléphone
  if(!lastPos||Date.now()-lastPos.timestamp>120000)await new Promise(r=>{if(!navigator.geolocation)return r();
   navigator.geolocation.getCurrentPosition(p=>{lastPos=p;r()},()=>r(),{enableHighAccuracy:true,maximumAge:60000,timeout:6000})});
  if(lastPos&&Date.now()-lastPos.timestamp<180000){if(!exifSeg)exifSeg=minimalExif(new Date(file.lastModified||Date.now()));
   const s2=addGps(exifSeg,lastPos);gpsAdded=s2!==exifSeg;exifSeg=s2;
   if(gpsAdded)origBlob=replaceExif(buf,addGps(rawSeg||minimalExif(new Date(file.lastModified||Date.now())),lastPos))}}
 let m="⚠ pas d'EXIF dans ce fichier";
 if(exifSeg)m=`<b>EXIF conservé ✓</b><br>${info.date||"date : maintenant"}<br>${info.gps?"<b>GPS ✓</b>":gpsAdded?"<b>GPS ✓ (position du téléphone)</b>":"GPS ✗ — autorise la localisation"}`;
 $("meta").innerHTML=m;
 const img=new Image();img.onload=()=>{srcImg=img;$("empty").style.display="none";view.style.display="block";
  const h=$("hint");h.style.display="block";setTimeout(()=>h.style.display="none",2500);render()};
 img.src=URL.createObjectURL(file)}
$("shutter").addEventListener("click",locate);
$("cam").onchange=e=>{load(e.target.files[0],true);e.target.value=""};
$("lib").onchange=e=>{load(e.target.files[0],false);e.target.value=""};
if("serviceWorker"in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});

// ---------- Enregistrement ----------
$("save").onclick=async()=>{if(!fullBlob)return;
 const base=(srcFile.name||"photo").replace(/\.[^.]+$/,"")||"photo",stamp=Date.now().toString(36);
 const name=`${base}_${film.id}_${stamp}.jpg`,files=[new File([fullBlob],name,{type:"image/jpeg"})];
 if($("withOrig").checked&&srcFile)files.push(new File([origBlob||srcFile],`${base}_original_${stamp}.jpg`,{type:srcFile.type||"image/jpeg"}));
 try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files});return}}
 catch(e){if(e&&e.name==="AbortError")return}
 const u=URL.createObjectURL(fullBlob);$("out").src=u;$("dl").href=u;$("dl").download=name;$("sheet").style.display="flex"};
$("close").onclick=()=>$("sheet").style.display="none";
</script>
